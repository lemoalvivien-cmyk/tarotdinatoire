name: CI — Tests & Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Type-check + Lint
  # ─────────────────────────────────────────────────────────────────────────────
  type-check:
    name: TypeScript + ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint src --ext .ts,.tsx --max-warnings 0

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Vitest Unit + Integration tests
  # ─────────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: Vitest Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm run test:ci

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. Build check (ensures production build doesn't break)
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [type-check]
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check bundle size
        run: |
          TOTAL=$(du -sh dist/ | cut -f1)
          echo "Bundle size: $TOTAL"
          # Fail if > 5MB gzipped
          SIZE_KB=$(du -sk dist/ | cut -f1)
          if [ "$SIZE_KB" -gt 10240 ]; then
            echo "⚠️ Bundle exceeds 10MB — investigate chunk splitting"
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. Security audit
  # ─────────────────────────────────────────────────────────────────────────────
  security:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high || true
