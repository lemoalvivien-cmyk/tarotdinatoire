<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg-gradient)"/>
  
  <!-- Glow circle -->
  <circle cx="256" cy="256" r="180" fill="url(#glow)"/>
  
  <!-- Star/Moon symbol -->
  <path d="M256 96 L276 196 L376 216 L276 236 L256 336 L236 236 L136 216 L236 196 Z" 
        fill="url(#star-gradient)" 
        opacity="0.9"/>
  
  <!-- Inner circle -->
  <circle cx="256" cy="256" r="120" stroke="url(#circle-gradient)" stroke-width="3" fill="none" opacity="0.6"/>
  
  <!-- Center moon -->
  <circle cx="256" cy="256" r="60" fill="url(#moon-gradient)"/>
  <circle cx="280" cy="240" r="50" fill="#1a1625"/>
  
  <defs>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="512" y2="512">
      <stop offset="0%" stop-color="#1a1625"/>
      <stop offset="100%" stop-color="#0d0a14"/>
    </linearGradient>
    
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    
    <linearGradient id="star-gradient" x1="136" y1="96" x2="376" y2="336">
      <stop offset="0%" stop-color="#d4a556"/>
      <stop offset="100%" stop-color="#f5d799"/>
    </linearGradient>
    
    <linearGradient id="circle-gradient" x1="136" y1="136" x2="376" y2="376">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    
    <linearGradient id="moon-gradient" x1="196" y1="196" x2="316" y2="316">
      <stop offset="0%" stop-color="#e8e4f0"/>
      <stop offset="100%" stop-color="#c4b8db"/>
    </linearGradient>
  </defs>
</svg>
